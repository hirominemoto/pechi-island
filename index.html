<style>
/* 画面いっぱいのジオラマ。左上に手書きの木の看板、右上に時間帯の切りかえ、左下に登場人物の名札、右下に丸い操作ボタン */
:root {
  --sky-top: #4fb2ea;
  --sky-mid: #b4e4f6;
  --sky-low: #fff2cc;
  --wood: #e6c58c;
  --wood-dark: #7a4f2c;
  --ink: #3b2a1c;
  --paint-red: #a83226;
  --paper: #fffdf4;
  --font-sign: "Yusei Magic", "Hachi Maru Pop", "Hiragino Maru Gothic ProN", "BIZ UDPGothic", "Yu Gothic", "Meiryo", sans-serif;
  --font-ui: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "BIZ UDPGothic", "Yu Gothic", "Meiryo", sans-serif;
  color-scheme: light;
}
html, body { height: 100%; }
body {
  margin: 0;
  overflow: hidden;
  background: linear-gradient(var(--sky-top), var(--sky-mid) 55%, var(--sky-low));
  color: var(--ink);
  font-family: var(--font-ui);
  font-weight: 500;
}
.stage { position: relative; height: 100%; min-height: 300px; overflow: hidden; }
#pechi { position: absolute; inset: 0; width: 100%; height: 100%; display: block; user-select: none; -webkit-user-select: none; }

.sign { position: absolute; left: 16px; top: 14px; transform: rotate(-2deg); transform-origin: left top; pointer-events: none; }
.plank {
  background: var(--wood);
  border: 2px solid var(--wood-dark);
  border-radius: 6px 9px 7px 10px;
  box-shadow: 0 3px 0 var(--wood-dark), 0 8px 16px rgba(30, 60, 100, .2);
  color: var(--ink);
  font-family: var(--font-sign);
  font-weight: 400;
}
.plank.main { margin: 0; padding: 0 20px 3px; font-size: clamp(28px, 5.2vw, 42px); line-height: 1.3; letter-spacing: .06em; }
.ropes { display: flex; justify-content: space-around; width: 62%; height: 9px; margin: 3px auto 0; }
.ropes i { width: 2px; background: var(--wood-dark); }
.plank.sub { width: max-content; margin: 0 auto; padding: 3px 13px 4px; text-align: center; font-size: clamp(11px, 2vw, 14px); line-height: 1.35; }
.plank.sub s { text-decoration-color: var(--paint-red); text-decoration-thickness: 2px; }
.plank.sub b { display: block; color: var(--paint-red); font-weight: 400; font-size: 1.3em; }

.side { position: absolute; right: 16px; top: 16px; max-width: min(56%, 250px); display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
.story {
  padding: 4px 12px; border: 2px solid var(--wood-dark); border-radius: 999px;
  background: var(--paper); color: var(--ink);
  font-size: 12px; font-weight: 700; text-decoration: none;
}
.story:hover { background: var(--wood); }
.story:focus-visible { outline: 3px solid var(--paper); outline-offset: 2px; }
.times {
  display: flex; gap: 2px; padding: 2px; border: 2px solid var(--wood-dark); border-radius: 999px;
  background: var(--paper); box-shadow: 0 2px 0 var(--wood-dark);
}
.times button {
  display: flex; align-items: center; gap: 3px; padding: 3px 9px 3px 6px; border: 0; border-radius: 999px;
  background: transparent; color: var(--ink); font: inherit; font-size: 12px; font-weight: 700; cursor: pointer;
}
.times button[aria-pressed="true"] { background: var(--wood); }
.times button svg { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.times button:focus-visible { outline: 3px solid var(--wood-dark); outline-offset: 1px; }
@media (max-width: 359px) { .times button span { display: none; } .times button { padding: 4px 8px; } }
.hint {
  margin: 0; padding: 6px 12px; border-radius: 12px;
  background: rgba(255, 253, 244, .82); color: var(--ink);
  font-size: 12px; line-height: 1.5; pointer-events: none;
  transition: opacity .6s;
}
.hint.gone { opacity: 0; }

.cast { position: absolute; left: 16px; bottom: 16px; display: flex; flex-wrap: wrap; gap: 8px; max-width: calc(100% - 92px); }
.cast button {
  display: flex; align-items: center; gap: 6px;
  padding: 3px 13px 3px 4px; border: 2px solid var(--wood-dark); border-radius: 999px;
  background: var(--paper); color: var(--ink);
  font: inherit; font-size: 13px; font-weight: 700; cursor: pointer;
  box-shadow: 0 2px 0 var(--wood-dark);
}
.cast button[aria-pressed="true"] { background: var(--wood); }
.cast button svg { width: 30px; height: 30px; border-radius: 50%; background: var(--sky-mid); flex: none; }
.cast button:active, .ctrl button:active { transform: translateY(2px); box-shadow: none; }

.ctrl { position: absolute; right: 16px; bottom: 16px; display: flex; flex-direction: column; gap: 8px; }
.ctrl button {
  display: grid; place-items: center; width: 44px; height: 44px; padding: 0;
  border: 2px solid var(--wood-dark); border-radius: 50%;
  background: var(--wood); color: var(--ink); cursor: pointer;
  box-shadow: 0 2px 0 var(--wood-dark);
}
.ctrl button[aria-pressed="true"] { background: var(--paper); }
.ctrl button:disabled { opacity: .55; cursor: default; }
.ctrl button svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
button:focus-visible { outline: 3px solid var(--paper); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { .hint { transition: none; } }
</style>

<script>
// ペチ島 — 3Dモデル(地形)と投影。ブラウザでも Node でも動く。
(function (G) {
'use strict';
var P = G.Pechi = G.Pechi || {};
var TAU = Math.PI * 2, DEG = Math.PI / 180;
P.TAU = TAU; P.DEG = DEG;

// 決定的な乱数(毎回同じ島になる)
P.rng = function (seed) {
  var s = seed >>> 0;
  return function () {
    s = (s + 0x6D2B79F5) >>> 0;
    var t = Math.imul(s ^ (s >>> 15), 1 | s);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
};

function norm(v) { var l = Math.hypot(v[0], v[1], v[2]) || 1; return [v[0] / l, v[1] / l, v[2] / l]; }
function hex(c) {
  function h(x) { x = x < 0 ? 0 : x > 255 ? 255 : Math.round(x); return (x < 16 ? '0' : '') + x.toString(16); }
  return '#' + h(c[0]) + h(c[1]) + h(c[2]);
}
P.hex = hex;

// 地形は極座標メッシュ: 中心(山頂)から海岸線まで RING の輪を SECT 分割
var SECT = 48;
var RING = [0, .07, .15, .24, .33, .42, .50, .555, .60, .70, .76, .82, .89, .95, 1];
var HEIGHT = [94, 86, 73, 56, 39, 23, 11.5, 7.4, 6.4, 6.2, 5.5, 4.4, 2.4, 1.0, 0];
var BAND = [
  { c: [190, 194, 208] },                                   // 山頂の岩
  { c: [158, 162, 182] },
  { c: [134, 140, 162], mix: [72, 136, 68], p: .3 },
  { c: [70, 140, 66], mix: [134, 140, 162], p: .28 },
  { c: [58, 130, 62], mix: [88, 154, 66], p: .3 },           // ジャングル
  { c: [48, 114, 58], mix: [68, 138, 62], p: .3 },
  { c: [98, 174, 72] },                                     // 草地
  { c: [110, 184, 74] },
  { c: [238, 212, 156] },                                   // 島をぐるっと回る道
  { c: [122, 194, 80] },
  { c: [138, 202, 86] },
  { c: [172, 206, 106], mix: [238, 216, 154], p: .45 },
  { c: [244, 224, 166] },                                   // 砂浜
  { c: [228, 202, 148] }                                    // 波打ちぎわ
];
P.TRAIL_D = 0.65;
P.CAVE_A = 93.75;      // 洞窟の向き(度)。桟橋からまっすぐ山のふもとへ
var LIGHT = norm([-0.55, 0.72, 0.42]);

// 海岸線の形(角度ごとの半径)
P.outline = function (a) {
  return 100 * (1 + .07 * Math.sin(2 * a + .6) + .05 * Math.sin(3 * a + 2.1) + .03 * Math.sin(5 * a + 4));
};

function Scene() {
  this.vx = []; this.vy = []; this.vz = [];
  this.items = [];    // <path> スロットで描く面・円
  this.sprites = [];  // <use> で置く木やパイナップル
  this.signs = [];    // 文字をのせる看板の面
  this.rand = P.rng(20260425);
  buildTerrain(this);
  if (P.buildProps) P.buildProps(this);
}
P.Scene = Scene;
var SP = Scene.prototype;

SP.vert = function (x, y, z) { this.vx.push(x); this.vy.push(y); this.vz.push(z); return this.vx.length - 1; };

// 多角形を追加。o: {center, up, cull, kv, kb, flat, vary, n3}
SP.poly = function (vs, color, o) {
  o = o || {};
  var x = this.vx, y = this.vy, z = this.vz, q = o.n3 || vs, a = q[0], b = q[1], c = q[2];
  var ux = x[b] - x[a], uy = y[b] - y[a], uz = z[b] - z[a], wx = x[c] - x[a], wy = y[c] - y[a], wz = z[c] - z[a];
  var n = norm([uy * wz - uz * wy, uz * wx - ux * wz, ux * wy - uy * wx]);
  var cx = 0, cy = 0, cz = 0, i;
  for (i = 0; i < vs.length; i++) { cx += x[vs[i]]; cy += y[vs[i]]; cz += z[vs[i]]; }
  cx /= vs.length; cy /= vs.length; cz /= vs.length;
  var flip = o.center
    ? n[0] * (cx - o.center[0]) + n[1] * (cy - o.center[1]) + n[2] * (cz - o.center[2]) < 0
    : (o.up && n[1] < 0);
  if (flip) n = [-n[0], -n[1], -n[2]];
  var lum = o.flat ? 1 : 0.7 + 0.44 * Math.max(0, n[0] * LIGHT[0] + n[1] * LIGHT[1] + n[2] * LIGHT[2]);
  lum *= 1 + (this.rand() - .5) * (o.vary == null ? .06 : o.vary);
  var it = { t: 0, v: vs, n: n, cull: !!o.cull, kv: o.kv == null ? -1 : o.kv, kb: o.kb || 0,
    rgb: [color[0] * lum, color[1] * lum, color[2] * lum], lit: o.lit || 0, emit: o.emit || null, cv: o.cv || 0 };
  it.css = hex(it.rgb);
  this.items.push(it);
  return it;
};

// 円(球に見えるもの)。o.ground なら地面に寝た楕円
SP.disc = function (x, y, z, r, color, o) {

    Array.prototype.forEach.call(times.children, function (b) { b.setAttribute('aria-pressed', String(b.id === 'time-' + name)); });
    var sky = Pechi.TIMES[name].sky, st = document.documentElement.style;
    st.setProperty('--sky-top', Pechi.hex(sky[0])); st.setProperty('--sky-mid', Pechi.hex(sky[2])); st.setProperty('--sky-low', Pechi.hex(sky[4]));
  }
  var P = Pechi, island = P.mount(document.getElementById('pechi'), { time: P.hashTime(),
    // ふきだしがかかってはいけない場所(看板・リンク・ボタン・名札)
    avoid: function () {
      var out = [], hint = document.getElementById('hint');
      ['.sign', '.story', '.times', '.cast', '.ctrl'].forEach(function (sel) { out.push(document.querySelector(sel).getBoundingClientRect()); });
      if (!hint.hidden && !hint.classList.contains('gone')) out.push(hint.getBoundingClientRect());
      return out;
    },
    onTime: function (name) {
    markTime(name);
    try { history.replaceState(null, '', name === 'day' ? location.pathname + location.search : '#' + name); } catch (e) {}
  }, onStorm: function (on) { document.getElementById('btn-storm').disabled = on; }, onFollow: function (name) {
    Array.prototype.forEach.call(cast.children, function (b) { b.setAttribute('aria-pressed', String(b.id === 'cast-' + name)); });
  } });
  window.pechiIsland = island;
  ['pechi', 'hiro', 'mira'].forEach(function (name) {
    var b = document.createElement('button');
    b.type = 'button';
    b.id = 'cast-' + name;
    b.innerHTML = '<svg viewBox="-7.5 -24 15 15" aria-hidden="true">' + P.charMarkup(name, false) + '</svg><span>' + P.NAMES[name] + '</span>';
    b.setAttribute('aria-pressed', 'false');
    b.title = P.NAMES[name] + 'を追いかける';
    b.addEventListener('click', function () { island.follow(b.getAttribute('aria-pressed') === 'true' ? null : name); });
    cast.appendChild(b);
  });
  P.TIME_ORDER.forEach(function (name) {
    var b = document.createElement('button');
    b.type = 'button';
    b.id = 'time-' + name;
    b.title = P.TIME_NAMES[name];
    b.innerHTML = '<svg viewBox="-12 -12 24 24" aria-hidden="true"><path d="' + P.TIME_ICON[name] + '"/></svg><span>' + P.TIME_NAMES[name] + '</span>';
    b.addEventListener('click', function () { island.setTime(name); });
    times.appendChild(b);
  });
  markTime(island.time());
  var rot = document.getElementById('btn-rot');
  rot.setAttribute('aria-pressed', String(island.cam.auto));
  rot.addEventListener('click', function () {
    island.setAuto(!island.cam.auto);
    rot.setAttribute('aria-pressed', String(island.cam.auto));
  });
  document.getElementById('btn-storm').addEventListener('click', function () { island.storm(); });
  document.getElementById('btn-in').addEventListener('click', function () { island.zoomBy(1.25); });
  document.getElementById('btn-out').addEventListener('click', function () { island.zoomBy(.8); });
  var hint = document.getElementById('hint');
  function hide() { hint.classList.add('gone'); }
  document.getElementById('pechi').addEventListener('pointerdown', hide, { once: true });
  setTimeout(hide, 9000);
})();
</script>
</body>
</html>
